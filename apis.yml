name: designstripe
description: 'The designstripe.com domain, blog and social handles were acquired by
  Visual (visual.app) in March 2025. Visual states on its own site that it acquired
  the marketing assets only and that Designstripe Inc. continues to operate independently,
  so this is an asset purchase rather than a rebrand. designstripe.com now 308-redirects
  to visual.app, an AI-first presentation and design-agent product for go-to-market
  teams — it generates presentations, proposals, QBRs and campaign assets through
  conversational agents with brand-lock consistency for sales, marketing and customer
  success. The legacy designstripe illustration marketplace and AI ad-maker have been
  retired. As of August 2026 the product is waitlist-only and markets an API on its
  homepage ("every agent is an endpoint... integrate design agents with your existing
  automation workflows or applications using our API"), but publishes no developer
  portal, API reference, OpenAPI definition, GraphQL endpoint, MCP server, SDK on any
  package registry, pricing page, or /.well-known discovery document. The one API-shaped
  host, api.designstripe.com, sits behind Google Cloud Identity-Aware Proxy and answers
  every request with "Invalid IAP credentials: empty token" while presenting a TLS
  certificate for an unrelated host. This profile was surfaced as an Insight Partners
  portfolio lead and enriched by the API Evangelist pipeline.'
